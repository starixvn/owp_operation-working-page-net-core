<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <!--
          manifest.json provides metadata used when your web app is added to the
          homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
        -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <!--
          Notice the use of %PUBLIC_URL% in the tags above.
          It will be replaced with the URL of the `public` folder during the build.
          Only files inside the `public` folder can be referenced from the HTML.

          Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
          work correctly both with client-side routing and a non-root public URL.
          Learn how to configure a non-root public URL by running `npm run build`.
        -->
    <title>Operation Working Page</title>
    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function () {
        if (!Notification) {
          alert(
            'Desktop notifications not available in your browser. Try Chromium.'
          );
          return;
        }
        if (Notification.permission !== 'granted')
          Notification.requestPermission();
      });
      function pushNotification(message) {
        if (!Notification || Notification.permission !== 'granted') {
          return;
        }

        var bodyContent = (message.messageContent.replaceAll('<b>', '')).replaceAll('</b>', '');

        var notification = new Notification('OWP Notification', {
          icon: 'favicon.ico',
          body: bodyContent
        });
        notification.onclick = () => {
          if (message.ticketId) {
            window.open('MyTickets?actorId=' + message.userId + '&eventType=' + message.eventType + '&ticketId=' + message.ticketId + '',`ticket-center-${message.ticketId}`);
          }
          else {
            window.open('MessageBoxManagement');
          }
        };
      }
    </script>
    <link href="/styles/fonts" rel="stylesheet" />
    <link href="/shared/themes/fonts/flags/flag-icon.css" rel="stylesheet" />
    <script src="/scripts/core"></script>
    <script src="/scripts/common"></script>
    <script src="/shared/owp/copy.js"></script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script>
      documentTitle.CountUnreadMessage();
    </script>
  </body>
</html>
